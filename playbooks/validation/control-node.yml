---
- name: Validate the Ansible control node and repository foundation
  hosts: control_nodes
  gather_facts: true
  become: false

  vars:
    sasd_required_repository_paths:
      - README.md
      - VERSION
      - ansible.cfg
      - manifests/milestone-2.yml
      - playbooks
      - roles
      - scripts

  tasks:
    - name: Validate the control-node operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.system in ['Linux', 'Darwin']
          - ansible_facts.python.version.major | int >= 3
          - ansible_facts.python.version.minor | int >= 12
        fail_msg: A UNIX-like control node with Python 3.12 or newer is required.
        success_msg: Control-node runtime is suitable for Milestone 2.

    - name: Read required repository paths
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../{{ item }}"
      loop: "{{ sasd_required_repository_paths }}"
      register: sasd_repository_paths

    - name: Validate required repository paths
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Required repository path is missing: {{ item.item }}"
        quiet: true
      loop: "{{ sasd_repository_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Display the validated Ansible runtime
      ansible.builtin.debug:
        msg:
          ansible_version: "{{ ansible_version.full }}"
          python_executable: "{{ ansible_facts.python.executable }}"
          repository_root: "{{ playbook_dir }}/../.."
