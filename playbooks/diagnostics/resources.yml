---
# Purpose: collect CPU, memory, swap, disk, inode, and process diagnostics.
# Safety: read-only on managed nodes; writes one JSON report on the control node.
- name: Collect Linux resource diagnostics
  hosts: linux_managed
  gather_facts: true
  become: false

  pre_tasks:
    - name: Resource diagnostics | Freeze run identifier
      ansible.builtin.set_fact:
        sasd_diagnostics_run_id_effective: >-
          {{ sasd_diagnostics_run_id | default(ansible_facts.date_time.iso8601_basic_short, true) }}

  roles:
    - role: sasd_resource_diagnostics
      vars:
        sasd_resource_diagnostics_report_root: >-
          {{
            sasd_diagnostics_report_root | default('reports/diagnostics')
            ~ '/' ~ sasd_diagnostics_run_id_effective
            ~ '/' ~ inventory_hostname
          }}
