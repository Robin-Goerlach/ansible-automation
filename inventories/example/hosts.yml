---
# Safe public inventory. It contains only localhost so commands from the README
# cannot accidentally target an external machine.
all:
  vars:
    ansible_python_interpreter: auto_silent
  children:
    control_nodes:
      hosts:
        localhost:
          ansible_connection: local
    linux_managed:
      hosts:
        localhost:
    webservers:
      hosts: {}
    database_servers:
      hosts: {}
