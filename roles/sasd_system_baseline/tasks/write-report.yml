---
- name: Shared report | Create local report directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../{{ sasd_report_root }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  when: sasd_report_enabled | bool

- name: Shared report | Write local JSON result
  ansible.builtin.copy:
    content: "{{ sasd_report_payload | to_nice_json }}\n"
    dest: "{{ playbook_dir }}/../../{{ sasd_report_root }}/{{ sasd_report_filename }}"
    mode: "0640"
  delegate_to: localhost
  become: false
  when: sasd_report_enabled | bool
