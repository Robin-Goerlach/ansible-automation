---
argument_specs:
  main:
    short_description: Audit or apply Nginx web-server configuration.
    options:
      sasd_nginx_mode:
        type: str
        choices: [audit, apply]
        default: audit
      sasd_nginx_apply_confirmation:
        type: str
        default: ""
      sasd_nginx_manage:
        type: bool
        default: false
      sasd_nginx_manage_packages:
        type: bool
        default: true
      sasd_nginx_packages:
        type: list
        elements: str
      sasd_nginx_manage_service:
        type: bool
        default: true
      sasd_nginx_service_name:
        type: str
        default: nginx
      sasd_nginx_virtual_hosts:
        type: list
        elements: dict
