---
argument_specs:
  main:
    short_description: Collect read-only service state diagnostics.
    options:
      sasd_service_diagnostics_monitored_services:
        type: list
        elements: str
      sasd_service_diagnostics_fail_on_missing_monitored:
        type: bool
        default: false
      sasd_service_diagnostics_report_enabled:
        type: bool
        default: true
      sasd_service_diagnostics_report_root:
        type: str
        default: reports/diagnostics/services
