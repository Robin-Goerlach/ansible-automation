---
argument_specs:
  main:
    short_description: Collect read-only network diagnostics.
    options:
      sasd_network_diagnostics_dns_names:
        type: list
        elements: str
      sasd_network_diagnostics_tcp_targets:
        type: list
        elements: dict
      sasd_network_diagnostics_timeout_seconds:
        type: int
        default: 3
      sasd_network_diagnostics_include_loopback:
        type: bool
        default: true
      sasd_network_diagnostics_report_enabled:
        type: bool
        default: true
      sasd_network_diagnostics_report_root:
        type: str
        default: reports/diagnostics/network
