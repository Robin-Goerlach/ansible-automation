---
sasd_time_synchronization_mode: audit
sasd_time_synchronization_apply_confirmation: ""
sasd_time_synchronization_manage: true
sasd_time_synchronization_provider: auto
sasd_time_synchronization_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
sasd_time_synchronization_fallback_servers:
  - 2.pool.ntp.org
  - 3.pool.ntp.org
sasd_time_synchronization_report_enabled: true
sasd_time_synchronization_report_root: reports/linux-baseline/time-synchronization
