---
- name: Apache | Validate safety and platform
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.os_family in sasd_apache_packages_by_family
      - sasd_apache_mode in ['audit', 'apply']
      - sasd_apache_service_state in ['started', 'stopped']
      - >-
        sasd_apache_mode == 'audit' or
        sasd_apache_apply_confirmation == 'SASD_APPLY_WEB_SERVICES'
    fail_msg: Apache apply mode requires a supported Linux family and the exact Milestone 3 token.

- name: Apache | Derive platform settings
  ansible.builtin.set_fact:
    sasd_apache_effective_packages: >-
      {{ sasd_apache_packages if sasd_apache_packages | length > 0
         else sasd_apache_packages_by_family[ansible_facts.os_family] }}
    sasd_apache_log_dir: "{{ sasd_apache_log_dir_by_family[ansible_facts.os_family] }}"
    sasd_apache_effective_service_name: >-
      {{ sasd_apache_service_name if sasd_apache_service_name | length > 0
         else sasd_apache_service_by_family[ansible_facts.os_family] }}
    sasd_apache_vhost_available_dir: "{{ sasd_apache_vhost_available_dir_by_family[ansible_facts.os_family] }}"
    sasd_apache_vhost_enabled_dir: "{{ sasd_apache_vhost_enabled_dir_by_family[ansible_facts.os_family] }}"

- name: Apache | Install approved packages
  ansible.builtin.package:
    name: "{{ sasd_apache_effective_packages }}"
    state: present
  when:
    - sasd_apache_mode == 'apply'
    - sasd_apache_manage | bool
    - sasd_apache_manage_packages | bool

- name: Apache | Locate control binary
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ sasd_apache_binary_candidates }}"
  register: sasd_apache_binary_stats

- name: Apache | Select control binary and validation command
  ansible.builtin.set_fact:
    sasd_apache_binary: >-
      {{ (sasd_apache_binary_stats.results | selectattr('stat.exists') |
          map(attribute='item') | first) | default('') }}

- name: Apache | Build validation command
  ansible.builtin.set_fact:
    sasd_apache_configtest_argv: >-
      {{ [sasd_apache_binary, 'configtest'] if ansible_facts.os_family in ['Debian', 'Suse']
         else [sasd_apache_binary, '-t'] }}
  when: sasd_apache_binary | length > 0

- name: Apache | Collect package facts
  ansible.builtin.package_facts:
    manager: auto
  failed_when: false

- name: Apache | Collect service facts
  ansible.builtin.service_facts:
  failed_when: false

- name: Apache | Inspect configured virtual-host files
  ansible.builtin.stat:
    path: "{{ sasd_apache_vhost_available_dir }}/{{ item.name }}.conf"
  loop: "{{ sasd_apache_virtual_hosts }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  register: sasd_apache_vhost_stats
  when: item.name is defined

- name: Apache | Audit complete configuration
  ansible.builtin.command:
    argv: "{{ sasd_apache_configtest_argv }}"
  register: sasd_apache_configtest
  changed_when: false
  failed_when: false
  when: sasd_apache_binary | length > 0

- name: Apache | Audit virtual-host map
  ansible.builtin.command:
    argv: ["{{ sasd_apache_binary }}", -S]
  register: sasd_apache_vhost_map
  changed_when: false
  failed_when: false
  when: sasd_apache_binary | length > 0

- name: Apache | Apply managed modules on Debian-family systems
  ansible.builtin.command:
    argv: [a2enmod, "{{ item }}"]
  loop: "{{ sasd_apache_modules }}"
  register: sasd_apache_module_enable
  changed_when: "'Enabling module' in sasd_apache_module_enable.stdout"
  notify: Apache | Reload service
  when:
    - sasd_apache_mode == 'apply'
    - sasd_apache_manage | bool
    - ansible_facts.os_family == 'Debian'

- name: Apache | Ensure virtual-host directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [sasd_apache_vhost_available_dir | default('/etc/apache2/sites-available'),
          sasd_apache_vhost_enabled_dir | default('/etc/apache2/sites-enabled')] | unique }}
  when:
    - sasd_apache_mode == 'apply'
    - sasd_apache_manage | bool

- name: Apache | Manage declared virtual hosts
  ansible.builtin.include_tasks: manage-vhost.yml
  loop: "{{ sasd_apache_virtual_hosts }}"
  loop_control:
    loop_var: sasd_apache_vhost
    label: "{{ sasd_apache_vhost.name | default('unnamed') }}"
  when:
    - sasd_apache_mode == 'apply'
    - sasd_apache_manage | bool
    - sasd_apache_binary | length > 0

- name: Apache | Ensure requested service state
  ansible.builtin.service:
    name: "{{ sasd_apache_effective_service_name }}"
    enabled: "{{ sasd_apache_service_enabled }}"
    state: "{{ sasd_apache_service_state }}"
  when:
    - sasd_apache_mode == 'apply'
    - sasd_apache_manage | bool
    - sasd_apache_manage_service | bool

- name: Apache | Build audit result
  ansible.builtin.set_fact:
    sasd_apache_result:
      schema: sasd.apache.v1
      host: "{{ inventory_hostname }}"
      collected_at_utc: "{{ ansible_facts.date_time.iso8601 }}"
      mode: "{{ sasd_apache_mode }}"
      manage_enabled: "{{ sasd_apache_manage | bool }}"
      package_names: "{{ sasd_apache_effective_packages }}"
      packages_installed: >-
        {{ sasd_apache_effective_packages | select('in', ansible_facts.packages | default({})) | list }}
      service_name: "{{ sasd_apache_effective_service_name }}"
      service_state: >-
        {{ (ansible_facts.services | default({})).get(
           sasd_apache_effective_service_name + '.service', {}
         ).get('state', 'unknown') }}
      control_binary: "{{ sasd_apache_binary }}"
      configuration_valid: >-
        {{ (sasd_apache_configtest.rc | default(127)) == 0 }}
      virtual_hosts_declared: "{{ sasd_apache_virtual_hosts | map(attribute='name') | list }}"
      virtual_hosts_present: >-
        {{ sasd_apache_vhost_stats.results | default([]) |
           selectattr('stat.exists', 'defined') | selectattr('stat.exists') |
           map(attribute='item.name') | list }}

- name: Apache | Write local JSON report
  ansible.builtin.include_tasks: ../../sasd_system_baseline/tasks/write-report.yml
  vars:
    sasd_report_enabled: "{{ sasd_apache_report_enabled }}"
    sasd_report_root: "{{ sasd_apache_report_root }}"
    sasd_report_payload: "{{ sasd_apache_result }}"
    sasd_report_filename: "{{ inventory_hostname }}.json"
